name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: python -m pip install -r services/python_app/requirements.txt
      - name: Check Python dependency compatibility
        run: bash ./scripts/check_python_deps.sh
      - name: Run Python tests
        run: |
          cd services/python_app
          python -m pytest -q
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node deps, start server, and run tests
        run: |
          cd services/node_app
          npm ci
          # start the dev server in the background
          npm run dev &
          # wait for the server to be available, then run tests
          npx wait-on http://localhost:3000
          npm test

  terraform:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.8'
          terraform_wrapper: false
      - name: Terraform Init
        run: |
          cd infra/terraform/aws
          terraform init
      - name: Terraform Plan
        run: |
          cd infra/terraform/aws
          terraform plan
