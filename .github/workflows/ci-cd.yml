name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: python -m pip install -r services/python_app/requirements.txt
      - name: Check Python dependency compatibility
        run: bash ./scripts/check_python_deps.sh
      - name: Run Python tests
        run: |
          cd services/python_app
          python -m pytest -q
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node deps, start server, and run tests
        run: |
          cd services/node_app
          npm ci
          # start the dev server in the background
          npm run dev &
          # wait for the server to be available, then run tests
          npx wait-on http://localhost:3000
          npm test

  terraform:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Terraform (apt)
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common curl lsb-release
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          DIST=$(lsb_release -cs)
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com ${DIST} main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y terraform
          terraform -version
      - name: Terraform (PR-safe init & validate)
        if: github.event_name == 'pull_request'
        run: |
          cd infra/terraform/aws
          terraform init -backend=false
          terraform validate
          echo "Skipping 'terraform plan' for pull requests because provider credentials are not available in forks/PRs."
      - name: Terraform (full init & plan)
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          cd infra/terraform/aws
          terraform init
          terraform plan -input=false
